<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTwistdx | Portfolio</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e4e4e7;
      --glow: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .container::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
      pointer-events: none;
    }

    .dev-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: #52525b;
      transform: translateY(-2px);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .link-value {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 400;
    }

    .quote {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="dev-tag">「DEV」</div>
    
    <h1>DevTwistdx ⚡</h1>
    <p class="subtitle">16yo Roblox Developer</p>

    <div class="status-badge">
      <span class="dot"></span>
      <span>Building games & UI</span>
    </div>

    <div class="links">
      <div class="link-card">
        <div class="link-info">
          <span>🎮 Roblox</span>
        </div>
        <span class="link-value">tigerteam110</span>
      </div>

      <div class="link-card">
        <div class="link-info">
          <span>💬 Discord</span>
        </div>
        <span class="link-value">twistdx</span>
      </div>
    </div>

    <div class="quote">
      "Built different. 🥶"
    </div>
  </div>

</body>
</html>
